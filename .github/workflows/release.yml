name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  native-archives:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-version: "1.28.1"
      - name: Install UI build dependencies
        run: bun install --frozen-lockfile
      - name: Build embedded UI and verify native tree
        run: |
          bash scripts/stage-ui-assets.sh
          go test ./...
          bazel test //...
      - name: Build and verify checksummed native archives
        run: bash scripts/verify-release-archives.sh
      - name: Collect release files
        run: |
          mkdir -p release-out
          cp bazel-bin/release/*.tar.gz bazel-bin/release/checksums.txt install.sh release-out/
          cmp install.sh release-out/install.sh
      - name: Upload native release payload
        uses: actions/upload-artifact@v4
        with:
          name: native-archives
          path: release-out/*
          if-no-files-found: error

  native-archive-smoke:
    needs: native-archives
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: darwin_arm64
          - runner: macos-15-intel
            platform: darwin_amd64
          - runner: ubuntu-latest
            platform: linux_amd64
          - runner: ubuntu-24.04-arm
            platform: linux_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Download exact native release payload
        uses: actions/download-artifact@v4
        with:
          name: native-archives
          path: release-out
      - name: Verify release installer asset
        run: cmp install.sh release-out/install.sh
      - name: Install and execute host-native release archive
        run: |
          bash scripts/verify-native-installer.sh \
            "release-out/localreview_${{ matrix.platform }}.tar.gz" \
            release-out/checksums.txt

  desktop-artifacts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            electron_args: --mac dmg
            artifact_name: desktop-macos
            artifact_glob: desktop/dist/*.dmg
          - runner: ubuntu-latest
            electron_args: --linux AppImage
            artifact_name: desktop-linux
            artifact_glob: desktop/dist/*.AppImage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-version: "1.28.1"
      - name: Build current embedded UI
        run: |
          bun install --frozen-lockfile
          bash scripts/stage-ui-assets.sh
      - name: Build host sidecar
        run: bazel build //cmd/localreviewd:localreviewd
      - name: Install desktop packaging dependencies
        run: npm --prefix desktop install --no-audit --no-fund
      - name: Verify Electron sidecar lifecycle
        run: |
          npm --prefix desktop run check
          npm --prefix desktop run verify:sidecar
      - name: Package desktop application
        run: npm --prefix desktop run package -- ${{ matrix.electron_args }}
      - name: Verify packaged Electron boundary
        run: |
          artifact=$(find desktop/dist -type d \( -name '*.app' -o -name '*unpacked' \) -print -quit)
          test -n "$artifact"
          npm --prefix desktop run verify:package -- "$artifact"
      - name: Upload desktop release payload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  publish:
    needs: [native-archives, native-archive-smoke, desktop-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release payloads
        uses: actions/download-artifact@v4
        with:
          path: release-out
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-out/*
